name: Build Windows .exe

on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.10.0

      - name: Build one-file exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm BeatVideoCutter.spec

      - name: Show output
        shell: pwsh
        run: |
          Get-ChildItem dist
          Get-Item dist\BeatVideoCutter.exe | Format-List Length, LastWriteTime

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatVideoCutter-windows
          path: dist/BeatVideoCutter.exe
          if-no-files-found: error
          retention-days: 30
